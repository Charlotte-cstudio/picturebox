.til{display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--lysgraa);font-weight:500}
.pb{display:flex;align-items:center;gap:10px;font-family:var(--tekst);font-weight:600;font-size:19px;letter-spacing:-.01em;color:var(--blaek);text-transform:none}
.pb svg{width:34px;height:34px;display:block;border-radius:8px;box-shadow:0 4px 12px rgba(109,93,246,.25)}

/* Typografi */
h1,h2,h3{font-family:var(--display);font-weight:500;letter-spacing:-.005em;text-wrap:balance;margin:0;color:var(--blaek)}
h1{font-size:clamp(42px,6.2vw,72px);line-height:1.04}
h2{font-size:clamp(34px,4.4vw,50px);line-height:1.08}
h3{font-size:26px;line-height:1.2}
.haand{font-family:var(--haand);font-weight:500;color:var(--f2);font-size:1.15em;letter-spacing:0}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--f1)}
.lead{font-size:19px;color:var(--graa);max-width:58ch;margin:22px 0 0}
p{max-width:64ch}

/* Grid */
.grid{display:grid;grid-template-columns:380px minmax(0,1fr);gap:72px;margin-top:48px;align-items:start}
@media (max-width:940px){.grid{grid-template-columns:minmax(0,1fr);gap:24px;margin-top:28px}}
.hjulkol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 28px)}
@media (max-width:940px){.hjulkol{position:static;max-width:420px;margin:0 auto;width:100%}}
svg.hjul{width:100%;height:auto;display:block}
.seg{cursor:pointer;transition:opacity .3s}
.seg:focus{outline:none}
.seg:focus-visible circle.nrring{stroke-width:5}
.hjulnoter{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.note{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;font:inherit;font-size:15px;padding:10px 14px;border:1px solid transparent;border-radius:6px;background:transparent;color:inherit;text-align:left;cursor:pointer;transition:background .2s,border-color .2s}
.note:hover{background:var(--kort)}
.note[aria-current="true"]{background:var(--kort);border-color:var(--linje)}
.note .nr{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:15px}
.note b{font-family:var(--display);font-weight:500;font-size:18px}
.note .tal{font-size:13px;color:var(--lysgraa);font-variant-numeric:tabular-nums}
.note:focus-visible{outline:2px solid var(--f2);outline-offset:2px}
@media (max-width:940px){svg.hjul{max-width:250px;margin:0 auto}.hjulnoter{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:4px}.note{grid-template-columns:24px auto auto;gap:8px;padding:6px 10px}.note .nr{width:24px;height:24px;font-size:13px}.note b{font-size:15px}}

/* Intro */
.faser{display:flex;flex-direction:column;gap:14px;margin-top:34px}
.fasekort{display:grid;grid-template-columns:44px minmax(0,1fr);gap:18px;align-items:start;background:var(--kort);border-radius:8px;padding:22px 24px}
.fasekort .nr{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:19px}
.fasekort h3{font-size:24px}
.fasekort p{margin:4px 0 0;color:var(--graa);font-size:16px}
.citat{font-family:var(--display);font-size:clamp(24px,2.6vw,30px);line-height:1.3;margin:48px 0 0;max-width:30ch}
.info{margin-top:36px;padding:24px 26px;border-left:3px solid var(--f1);background:color-mix(in srgb,var(--sand) 45%,transparent);border-radius:0 8px 8px 0}
.info h3{font-size:22px}
.info p{margin:8px 0 0;color:var(--graa);font-size:16px}
.trin{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-direction:column;gap:14px;max-width:62ch;counter-reset:t}
.trin li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;font-size:16px;color:var(--graa)}
.trin li::before{counter-increment:t;content:counter(t);width:24px;height:24px;border-radius:50%;border:1.5px solid var(--f1);color:var(--f1);display:grid;place-items:center;font-size:12px;font-weight:600;margin-top:2px}
.trin b{color:var(--blaek);font-weight:500}

/* Formular */
.felt{display:flex;flex-direction:column;gap:8px}
label{font-weight:400;font-size:16px;color:var(--blaek)}
input[type=text],textarea{width:100%;font:inherit;font-weight:300;font-size:16px;color:var(--blaek);background:#FFFEFB;border:1px solid var(--linje);border-radius:6px;padding:13px 15px;transition:border-color .2s,box-shadow .2s}
textarea{min-height:96px;resize:vertical;line-height:1.55}
input::placeholder,textarea::placeholder{color:#B3AA9C}
input:focus,textarea:focus{outline:none;border-color:var(--f1);box-shadow:0 0 0 4px color-mix(in srgb,var(--f1) 16%,transparent)}
.navn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;margin-top:36px;max-width:640px}
@media (max-width:540px){.navn{grid-template-columns:minmax(0,1fr)}}
.valg{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-weight:400;font-size:15px;padding:12px 20px;border:1px solid var(--linje);background:var(--kort);color:var(--blaek);border-radius:6px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blaek);color:var(--papir);border-color:var(--blaek)}
.knap{font:inherit;font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:4px;border:1px solid var(--knap);background:var(--knap);color:#F4F1EA;cursor:pointer;text-decoration:none;transition:background .2s}
.knap:hover{background:var(--knap-hover);border-color:var(--knap-hover)}
.knap.sek{background:var(--kort);color:var(--blaek);border-color:var(--linje)}
.knap.sek:hover{background:#fff}
.knap:focus-visible,.chip:focus-visible{outline:2px solid var(--f2);outline-offset:3px}
.handling{display:flex;gap:12px;flex-wrap:wrap;margin-top:36px;align-items:center}
.lille{font-size:14px;color:var(--lysgraa)}

/* Fase */
.fasehoved{display:flex;align-items:center;gap:14px}
.fasehoved .nr{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:21px;flex:none}
.forklar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:30px}
@media (max-width:760px){.forklar{grid-template-columns:minmax(0,1fr)}}
.forklar > div{background:var(--kort);border-radius:8px;padding:20px 22px;min-width:0}
.forklar .eyebrow{display:block;margin-bottom:8px;font-size:11px}
.forklar p{margin:0;font-size:15.5px;color:var(--graa)}
.afsnit{margin-top:56px}
.afsnit h3{display:flex;gap:14px;align-items:baseline;padding-bottom:12px;border-bottom:1px solid var(--linje)}
.afsnit h3 .nr{font-family:var(--tekst);font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--f1)}
.afsnit .hvorfor{font-size:15px;color:var(--lysgraa);margin:12px 0 0}
.sp{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:24px 0 0}
.sp .nr{font-size:13px;font-weight:500;color:var(--lysgraa);padding-top:3px;font-variant-numeric:tabular-nums;display:flex;align-items:flex-start;gap:6px}
.sp.besvaret .nr{color:var(--f1)}
.sp.besvaret .nr::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--f1);margin-top:7px}
.sp label{display:block;margin-bottom:10px;line-height:1.45}
.pv{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 18px;margin:0 0 12px;background:#FFFEFB;border:1px solid var(--linje);border-radius:8px}
.pv-ikon svg{width:52px;height:52px;display:block;border-radius:12px;box-shadow:0 6px 16px rgba(109,93,246,.25)}
.pv .sw{width:44px;height:44px;border-radius:8px;display:block}
.pv-tekst{font-size:14px;color:var(--graa);font-variant-numeric:tabular-nums}
.pv-citat{margin:0;font-family:var(--display);font-size:22px;line-height:1.35;color:var(--blaek)}
.pv-citat.pv-lille{font-size:18px}
.pv-navn{margin:0;font-family:var(--tekst);font-weight:600;font-size:24px;letter-spacing:-.01em}
.vchips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.vchip{font:inherit;font-size:14px;font-weight:400;padding:9px 16px;border:1px solid var(--linje);background:var(--kort);color:var(--blaek);border-radius:999px;cursor:pointer;transition:background .15s}
.vchip:hover{background:#fff}
.vchip[aria-pressed="true"]{background:var(--blaek);border-color:var(--blaek);color:var(--papir)}
.vchip:focus-visible{outline:2px solid var(--f2);outline-offset:2px}
.tidligere{margin-top:22px;padding:22px 24px;background:color-mix(in srgb,var(--sand) 50%,transparent);border-radius:8px}
.tidligere p{margin:8px 0 12px;font-size:15px;color:var(--graa)}
.tl-r{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;padding:9px 0;border-top:1px solid var(--linje);font-size:15px}
@media (max-width:540px){.tl-r{grid-template-columns:minmax(0,1fr);gap:2px}}
.tl-l{font-weight:500}
.tl-tom{color:var(--lysgraa);font-style:italic}
.tidligere .tl-valg{margin:14px 0 0;font-size:14px}
.tidligere .tl-valg b{color:var(--blaek);font-weight:500}
.valgmaerke{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:999px;background:var(--blaek);color:var(--papir);font-size:12px;font-weight:500}
.hint{margin:-4px 0 12px;font-size:14px;line-height:1.5;color:var(--lysgraa);padding-left:12px;border-left:2px solid var(--sand)}
.statusbar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;margin-top:48px;padding-top:22px;border-top:1px solid var(--linje)}
.gemt{font-size:13px;color:var(--lysgraa)}

/* Afslut */
.oversigt{margin-top:30px;display:flex;flex-direction:column;gap:10px}
.oversigt .r{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:16px 20px;background:var(--kort);border-radius:8px}
.oversigt .nr{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:17px}
.oversigt b{font-family:var(--display);font-weight:500;font-size:21px}

.vigtig{margin-top:32px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:16px;align-items:start;padding:22px 24px;background:var(--knap);color:#F4F1EA;border-radius:8px}

textarea.skjult{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

footer{margin-top:80px;padding-top:26px;border-top:1px solid var(--linje);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
footer .cs-logo{width:110px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:ind .4s ease-out}
@keyframes ind{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}

<script>
const FASER = [
  { id:"fase-1", nr:1, navn:"Klar strategi", farve:"--f1",

    hvad:"Ambition, forretningsmodel, kunder og de rammer, I arbejder inden for.",
    hvorfor:"Uden en fælles retning bliver hver aktivitet et enkeltstående forsøg. Med den kan hver opgave måles på, om den flytter PictureBox derhen.",

    afsnit:[
      {nr:1, titel:"Ambition og retning", hvorfor:"Det svar, alt andet bygger på.", q:[
        ["1.1","Hvad skal PictureBox være om tre år? Beskriv det i én sætning.","Tænk på, hvordan en kunde ville beskrive PictureBox om tre år. Én sætning er nok."],
        ["1.2","Hvad betyder succes for jer: livsstilsvirksomhed, vækstvirksomhed eller salg på sigt?","En livsstilsvirksomhed giver jer en god indtægt og frihed uden at skulle vokse hele tiden. En vækstvirksomhed skal blive markant større år for år. Salg på sigt betyder, at målet er at sælge PictureBox en dag."],

        ["2.1","Hvem skal betale for PictureBox: værten, gæsten, festlokalet eller virksomheden?","Den, der betaler, er den, salget skal rettes mod. Flere kan betale, men hvem er vigtigst for jer?"],

        ["9.4","Er vilkår, privatlivspolitik og samtykke til brug af billeder på plads for både private og erhverv?","Vilkår og privatlivspolitik er de tekster, brugerne accepterer. Samtykke handler om, at gæster ved, hvem der kan se og bruge deres billeder."],

      {nr:4, titel:"Produkt og udvikling", hvorfor:"Det, kunderne faktisk bruger, viser hvor værdien ligger.", q:[

      {nr:6, titel:"Brand og fortælling", hvorfor:"Folk stoler på mennesker. Jeres egen historie er det stærkeste bevis.", q:[

        ["11.7","Hvor oplever I, at jeres udtryk virker i dag, og hvor virker det ikke?","Fx hjemmesiden, App Store-siden, sociale medier eller materiale til festlokaler."],

  { id:"fase-3", nr:3, navn:"Digital forretning", farve:"--f3",

    afsnit:[
      {nr:5, titel:"Data og måling", hvorfor:"Udgangspunktet skal kendes, før fremgang kan måles.", q:[

        ["5.3","Hvor mange værter opretter mere end én begivenhed?","Det viser, om kunderne kommer igen, fx et festlokale eller en familie, der holder flere fester."],

const NOEGLE = "pb-klarhed-v1";
let tilstand = { navn:"", hvem:"", svar:{} };
try { const g = JSON.parse(localStorage.getItem(NOEGLE) || "null"); if (g && typeof g === "object") tilstand = Object.assign(tilstand, g); } catch(e) {}
function gem(){ try { localStorage.setItem(NOEGLE, JSON.stringify(tilstand)); } catch(e) {} }

const alleSp = f => f.afsnit.flatMap(a => a.q);
const besvaret = n => !!((tilstand.svar[n]||"").trim() || tilstand.svar[n+"v"]);
const antalSvar = f => alleSp(f).filter(([n]) => besvaret(n)).length;
const ALLE = FASER.reduce((s,f)=>s+alleSp(f).length,0);
const total = () => FASER.reduce((s,f)=>s+antalSvar(f),0);
const farve = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fid = n => n.replace('.','-');
function visning(){ const h = location.hash.slice(1); return ["fase-1","fase-2","fase-3","afslut"].includes(h) ? h : "start"; }

/* ---------- Hjulet, tegnet som på cstudio.dk ---------- */
function pt(r,a){ const rad=(a-90)*Math.PI/180; return [200+r*Math.cos(rad), 200+r*Math.sin(rad)]; }
function arc(r,a1,a2){ const [x1,y1]=pt(r,a1),[x2,y2]=pt(r,a2); return `M${x1.toFixed(1)} ${y1.toFixed(1)}A${r} ${r} 0 ${a2-a1>180?1:0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; }
function tegnHjul(){
  const v = visning(), svg = document.getElementById("hjul");
  const navn = tilstand.hvem || "";
  let h = `<defs><filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6e2c2c" flood-opacity=".18"/></filter></defs>
    <circle cx="200" cy="200" r="188" fill="none" stroke="${farve('--prik')}" stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round"/>`;
  FASER.forEach((f,i)=>{
    const c = farve(f.farve), start = i*120 - 52, slut = start + 96; // bue, der ender i en pil
    const aktiv = v===f.id, dim = v.startsWith("fase") && !aktiv ? .32 : 1;
    const andel = antalSvar(f)/alleSp(f).length;
    const [ax,ay] = pt(150, slut+1);
    const [nx,ny] = pt(150, i*120);
    h += `<g class="seg" tabindex="0" role="link" data-id="${f.id}" aria-label="Fase ${f.nr}: ${f.navn}, ${antalSvar(f)} af ${alleSp(f).length} besvaret" style="opacity:${dim}">
      <path d="${arc(150,start,slut)}" fill="none" stroke="${c}" stroke-width="22" filter="url(#ds)"/>
      <polygon points="-19,0 19,0 0,-26" fill="${c}" transform="translate(${ax.toFixed(1)} ${ay.toFixed(1)}) rotate(${slut+1+90})" filter="url(#ds)"/>
      ${andel>0?`<path d="${arc(176,start,start+96*andel)}" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`:""}
      <circle class="nrring" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="21" fill="${aktiv?c:farve('--papir')}" stroke="${c}" stroke-width="3"/>
      <text x="${nx.toFixed(1)}" y="${ny.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-family="Playfair Display,serif" font-size="22" fill="${aktiv?'#fff':c}">${f.nr}</text>
    </g>`;
  });
  h += `<circle cx="200" cy="200" r="98" fill="${farve('--kort')}" filter="url(#ds)"/>
    <text x="200" y="156" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" font-weight="500" letter-spacing="2.6" fill="${farve('--f1')}">KLARHEDSHJULET</text>
    <text x="200" y="196" text-anchor="middle" font-family="Playfair Display,serif" font-size="29" fill="${farve('--blaek')}">PictureBox</text>
    <text x="200" y="232" text-anchor="middle" font-family="Caveat,cursive" font-weight="500" font-size="27" fill="${farve('--f2')}">${total()} af ${ALLE} svar</text>
    <path d="M150 246 C 175 252, 225 242, 252 248" fill="none" stroke="${farve('--f2')}" stroke-width="1.6" stroke-linecap="round" opacity=".6"/>`;
  svg.innerHTML = h;
  svg.querySelectorAll(".seg").forEach(g=>{
    const gaa = ()=>{ location.hash = g.dataset.id; };
    g.addEventListener("click", gaa);
    g.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); gaa(); }});
  });
  document.getElementById("noter").innerHTML = FASER.map(f=>`
    <button class="note" type="button" data-id="${f.id}" aria-current="${v===f.id}">
      <span class="nr" style="background:var(${f.farve})">${f.nr}</span>
      <b>${f.navn}</b>
      <span class="tal">${antalSvar(f)}/${alleSp(f).length}</span>
    </button>`).join("");
  document.querySelectorAll(".note").forEach(b=>b.addEventListener("click",()=>{ location.hash = b.dataset.id; }));
}

/* ---------- Visninger ---------- */
function visStart(){
  return `<section class="fade">
    <span class="eyebrow">PictureBox × C Studio · Fundamentet for planen</span>
    <h1 style="margin-top:16px">Før planen kommer <span class="haand" style="font-size:1.08em">retningen</span></h1>
    <p class="lead">Kenneth og Peter: her er de spørgsmål, der skal besvares, før en konkret plan for PictureBox kan tage form. De følger Klarhedshjulet, den metode jeg arbejder ud fra i C Studio.</p>
    <div class="faser">
      ${FASER.map(f=>`<div class="fasekort"><span class="nr" style="background:var(${f.farve})">${f.nr}</span><div><h3>${f.navn}</h3><p>${f.kort}</p></div></div>`).join("")}
    </div>
    <p class="citat">Hjulet er det samme hver gang. Det, der sker i hver fase, er skræddersyet til PictureBox.</p>
    <div class="info">
      <h3>Meget af det har vi allerede talt om</h3>
      <p>Nogle af spørgsmålene kender I svaret på, og vi har gennemgået dem sammen. Svar kort på dem alligevel. Så har jeg det hele samlet ét sted, med jeres egne ord, og planen bygger på det, I faktisk har sagt.</p>
    </div>
    <ol class="trin">
      <li><span><b>Svar hver for sig.</b> Forskelle mellem jeres svar er nyttige og bliver en del af samtalen bagefter.</span></li>
      <li><span><b>Skriv kort.</b> Stikord er fine, og «ved ikke endnu» er også et svar.</span></li>
      <li><span><b>Tag pauser, når I vil.</b> Svarene gemmes kun i den browser, du bruger nu. Brug samme computer og browser hele vejen, ellers starter du forfra. Regn med 15–25 minutter pr. fase.</span></li>
      <li><span><b>Send til sidst.</b> Du kopierer dine svar og sender dem til mig på mail. Jeg omsætter dem til en konkret plan, som vi gennemgår sammen.</span></li>
    </ol>
    <div class="vigtig"><span class="ikon">!</span><div><h3>Svarene sendes ikke automatisk</h3><p>Når du er færdig, skal du selv sende dine svar til mig på mail. Siden viser dig hvordan. <b>Du er først færdig, når mailen er sendt.</b></p></div></div>
    <div class="navn">
      <div class="felt"><label for="navn">Dit navn</label><input type="text" id="navn" autocomplete="name" value="${esc(tilstand.navn)}" placeholder="Skriv dit navn"></div>
      <div class="valg" role="group" aria-label="Hvem svarer">
        <button class="chip" type="button" data-hvem="Kenneth" aria-pressed="${tilstand.hvem==='Kenneth'}">Kenneth</button>
        <button class="chip" type="button" data-hvem="Peter" aria-pressed="${tilstand.hvem==='Peter'}">Peter</button>
      </div>
    </div>
    <div class="handling">
      <a class="knap" href="#fase-1">Start med fase 1 →</a>
      ${total()?`<a class="knap sek" href="#afslut">Se mine svar</a>`:""}
    </div>
  </section>`;
}

const VALG = ["Bevar","Justér","Ændr","Ved ikke"];
function visElement(v){
  if (v==="logo") return `<span class="pv-ikon">${document.querySelector(".pb svg")?.outerHTML||""}</span><span class="pv-tekst">App-ikon og logo</span>`;
  if (v==="farver") return `<span class="sw" style="background:#6D5DF6"></span><span class="sw" style="background:#8B5CF6"></span><span class="sw" style="background:linear-gradient(135deg,#6D5DF6,#8B5CF6)"></span><span class="pv-tekst">#6D5DF6 → #8B5CF6</span>`;
  return v;
}
function tidligere(){
  const vis = (n,lbl) => { const s=(tilstand.svar[n]||"").trim(); return `<div class="tl-r"><span class="tl-l">${lbl}</span><span class="${s?"":"tl-tom"}">${s?esc(s):"Ikke besvaret endnu"}</span></div>`; };
  return `<div class="tidligere">
    <span class="eyebrow">Det bygger på det, du har svaret</span>
    <p>Jeres branding skal passe til den retning og den kunde, I vælger. Hold derfor det, du ser nedenfor, op mod dine egne svar:</p>
    ${vis("1.1","PictureBox om tre år")}${vis("3.1","Primær kunde")}${vis("6.4","Tre ord")}
    <p class="tl-valg"><b>Bevar</b> virker og genkendes. <b>Justér</b> grundidéen holder, men skal skærpes. <b>Ændr</b> passer ikke til retningen. <b>Ved ikke</b> tager vi med i samtalen.</p>
  </div>`;
}
function visFase(f){
  const i = FASER.indexOf(f), naeste = FASER[i+1];
  return `<section class="fade">
    <div class="fasehoved"><span class="nr" style="background:var(${f.farve})">${f.nr}</span><span class="eyebrow" style="color:var(${f.farve})">Fase ${f.nr} af 3 · ${f.navn}</span></div>
    <h2 style="margin-top:18px">${f.titel}</h2>
    <div class="forklar">
      <div><span class="eyebrow">Fasen afklarer</span><p>${f.hvad}</p></div>
      <div><span class="eyebrow">Derfor betyder den noget</span><p>${f.hvorfor}</p></div>
      <div><span class="eyebrow">Det bliver til i planen</span><p>${f.planen}</p></div>
    </div>
    ${f.afsnit.map(a=>`
      <div class="afsnit">
        <h3><span class="nr">${String(a.nr).padStart(2,"0")}</span>${a.titel}</h3>
        <p class="hvorfor">${a.hvorfor}</p>
        ${a.profil?tidligere():""}
        ${a.q.map(([n,t,hj,vis])=>`
          <div class="sp ${besvaret(n)?"besvaret":""} ${vis?"sp-profil":""}">
            <span class="nr">${n}</span>
            <div style="min-width:0"><label for="s-${fid(n)}">${t}</label>${hj?`<p class="hint" id="h-${fid(n)}">${hj}</p>`:""}
            ${vis?`<div class="pv">${visElement(vis)}</div>
            <div class="vchips" role="group" aria-label="${t}: bevar, justér eller ændr">${VALG.map(v=>`<button type="button" class="vchip" data-n="${n}" data-v="${v}" aria-pressed="${tilstand.svar[n+"v"]===v}">${v}</button>`).join("")}</div>`:""}
            <textarea id="s-${fid(n)}" data-n="${n}" rows="${vis?2:3}" ${hj?`aria-describedby="h-${fid(n)}"`:""} placeholder="${vis?"Hvorfor? Og hvis noget skal ændres: hvad?":"Skriv kort. Stikord er fine."}">${esc(tilstand.svar[n]||"")}</textarea></div>
          </div>`).join("")}
      </div>`).join("")}
    <div class="statusbar">
      <span class="gemt" id="gemt">${antalSvar(f)} af ${alleSp(f).length} besvaret · gemt i din browser</span>
      <div class="handling" style="margin-top:0">
        ${i>0?`<a class="knap sek" href="#${FASER[i-1].id}">← Fase ${i}</a>`:`<a class="knap sek" href="#start">← Introduktion</a>`}
        ${naeste?`<a class="knap" href="#${naeste.id}">Videre til fase ${naeste.nr} →</a>`:`<a class="knap" href="#afslut">Gennemse og send →</a>`}
      </div>
    </div>
  </section>`;
}

function hvemNavn(){ return (tilstand.navn || tilstand.hvem || "").trim(); }
function dato(){ return new Date().toLocaleDateString("da-DK",{day:"numeric",month:"long",year:"numeric"}); }
function svarTekst(){
  let t = `PICTUREBOX · SVAR TIL C STUDIO\nFra: ${hvemNavn() || "(navn ikke angivet)"}\nDato: ${dato()}\nBesvaret: ${total()} af ${ALLE} spørgsmål\n`;
  FASER.forEach(f=>{
    t += `\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nFASE ${f.nr} · ${f.navn.toUpperCase()}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
    f.afsnit.forEach(a=>{
      t += `\n${a.nr}. ${a.titel.toUpperCase()}\n`;
      a.q.forEach(([n,q,hj,vis])=>{ const v=tilstand.svar[n+"v"]; t += `\n${n} ${q}\n${vis?`Valg: ${v||"(intet valg)"}\n`:""}→ ${(tilstand.svar[n]||"").trim() || (vis&&v?"(ingen kommentar)":"(ikke besvaret)")}\n`; });
    });
  });
  return t + `\n\nSendt via Klarhedshjulet · C Studio\n`;
}
function svarForhaand(){
  return FASER.map(f=>`<h4>${f.nr} · ${f.navn}</h4>` + f.afsnit.map(a=>a.q.map(([n,q,hj,vis])=>{
    const s=(tilstand.svar[n]||"").trim(), v=tilstand.svar[n+"v"];
    return `<p class="q">${n} ${q}${vis&&v?` <span class="valgmaerke">${v}</span>`:""}</p><p class="a ${s?"":"tom"}">${s?esc(s):(vis&&v?"Ingen kommentar":"Ikke besvaret")}</p>`;
  }).join("")).join("")).join("");
}

function visAfslut(){
  const emne = encodeURIComponent(`PictureBox · svar fra ${hvemNavn()}`.trim());
  return `<section class="fade">
    <span class="eyebrow">Hele hjulet</span>
    <h2 style="margin-top:14px">Tak. Nu har planen <span class="haand">et fundament</span></h2>
    <p class="lead">Du har besvaret ${total()} af ${ALLE} spørgsmål. Tomme felter er helt i orden. Dem tager vi med, når vi taler sammen.</p>
    <div class="vigtig"><span class="ikon">!</span><div><h3>Du er ikke færdig, før du har sendt mailen</h3><p>Dine svar er kun gemt i din egen browser. Jeg får dem først, når du har kopieret dem og sendt dem til <b>kontakt@cstudio.dk</b>. Det tager under et minut.</p></div></div>
    <div class="oversigt">
      ${FASER.map(f=>`<div class="r"><span class="nr" style="background:var(${f.farve})">${f.nr}</span><b>${f.navn}</b><span class="tal">${antalSvar(f)}/${alleSp(f).length}</span><button class="linkknap" type="button" data-gaa="${f.id}">Ret svar</button></div>`).join("")}
    </div>
    <div class="info" style="margin-top:40px">
      <h3>Sådan sender du svarene</h3>
      <ol class="trin" style="margin-top:14px">
        <li><span>Tryk på <b>Kopiér mine svar</b>. Alle dine svar ligger nu samlet og klar til at indsætte.</span></li>
        <li><span>Indsæt dem i en mail til <span class="adresse">kontakt@cstudio.dk</span> og send den.</span></li>
        <li><span>Når jeg har svar fra jer begge, samler jeg dem i en konkret plan, som vi gennemgår sammen.</span></li>
      </ol>
    </div>
    <div class="handling">
      <button class="knap" type="button" id="kopier">Kopiér mine svar</button>
      <a class="knap sek" href="mailto:kontakt@cstudio.dk?subject=${emne}">Åbn ny mail</a>
    </div>
    <p class="besked" id="besked" role="status"></p>
    <div class="forhaand" aria-label="Dine svar">
      <div class="hd"><span>Sådan ser dine svar ud</span><span>${esc(hvemNavn() || "Navn ikke angivet")} · ${dato()}</span></div>
      <div class="ind">${svarForhaand()}</div>
    </div>
    <textarea class="skjult" id="raa" aria-hidden="true" tabindex="-1" readonly>${esc(svarTekst())}</textarea>
    <p class="lille" style="margin-top:14px">Virker knappen ikke i din browser, så markér svarene ovenfor og kopiér dem selv. Knappen «Åbn ny mail» virker ikke i alle browsere, derfor står adressen her.</p>
  </section>`;
}

function render(){
  const v = visning(), m = document.getElementById("indhold");
  m.innerHTML = v==="start" ? visStart() : v==="afslut" ? visAfslut() : visFase(FASER.find(f=>f.id===v));
  tegnHjul(); kobl();
}

let t;
function kobl(){
  const navn = document.getElementById("navn");
  if (navn) navn.addEventListener("input", e=>{ tilstand.navn = e.target.value; gem(); });
  document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
    tilstand.hvem = c.dataset.hvem;
    if(!tilstand.navn){ tilstand.navn = c.dataset.hvem; const n=document.getElementById("navn"); if(n) n.value=c.dataset.hvem; }
    gem(); document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed", x===c));
  }));
  document.querySelectorAll(".vchip").forEach(c=>c.addEventListener("click",()=>{
    const n=c.dataset.n, ny = tilstand.svar[n+"v"]===c.dataset.v ? "" : c.dataset.v;
    if (ny) tilstand.svar[n+"v"]=ny; else delete tilstand.svar[n+"v"];
    gem();
    c.parentElement.querySelectorAll(".vchip").forEach(x=>x.setAttribute("aria-pressed", x.dataset.v===ny));
    c.closest(".sp").classList.toggle("besvaret", besvaret(n));
    const f = FASER.find(x=>x.id===visning()), g = document.getElementById("gemt");
    if (f && g) g.textContent = `${antalSvar(f)} af ${alleSp(f).length} besvaret · gemt i din browser`;
    tegnHjul();
  }));
  document.querySelectorAll("textarea[data-n]").forEach(ta=>ta.addEventListener("input",()=>{
    tilstand.svar[ta.dataset.n] = ta.value; gem();
    ta.closest(".sp").classList.toggle("besvaret", besvaret(ta.dataset.n));
    clearTimeout(t); t = setTimeout(()=>{
      const f = FASER.find(x=>x.id===visning()), g = document.getElementById("gemt");
      if (f && g) g.textContent = `${antalSvar(f)} af ${alleSp(f).length} besvaret · gemt i din browser`;
      tegnHjul();
    }, 250);
  }));
  document.querySelectorAll("[data-gaa]").forEach(b=>b.addEventListener("click",()=>{ location.hash = b.dataset.gaa; }));
  const k = document.getElementById("kopier");
  if (k) k.addEventListener("click", ()=>{
    const b = document.getElementById("besked");
    const ok = ()=>{ b.textContent = "Kopieret. Indsæt svarene i en mail til kontakt@cstudio.dk."; };
    const reserve = ()=>{
      const r = document.getElementById("raa");
      try { r.removeAttribute("aria-hidden"); r.select(); if (document.execCommand && document.execCommand("copy")) { ok(); return; } } catch(e) {}
      const s=getSelection(), rg=document.createRange(); rg.selectNodeContents(document.querySelector(".forhaand .ind")); s.removeAllRanges(); s.addRange(rg);
      b.textContent = "Svarene er markeret. Kopiér dem med Cmd+C eller Ctrl+C.";
    };
    try { navigator.clipboard.writeText(svarTekst()).then(ok).catch(reserve); } catch(e){ reserve(); }
  });
}

window.addEventListener("hashchange", ()=>{ render(); window.scrollTo(0,0); });
render();
</script>

</html>
